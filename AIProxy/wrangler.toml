name = "voicetodo-ai-proxy"
main = "worker.js"
compatibility_date = "2026-05-26"
workers_dev = true

# 自定义域名:workers.dev 在国内被 DNS 污染,绑自定义域名走 Cloudflare CDN (104.x.x.x)
routes = [
  { pattern = "ai.saydo.org", custom_domain = true }
]

[vars]
# ─── 每日额度：免费档 / Pro 档 ────────────────────────────────────────────────
# ⚠️ 这两个值必须成对修改，且 PAID > FREE。wrangler-config.test.js 有断言守着。
#
# 当前是【上线】值：
#   2026-08-20 首次切换上线值（free=2/Pro=100，随订阅验签修复一起部署）
#   2026-08-22 free 2→3 拍板（PROMOTION_PLAN §2.1）；2026-08-30 已 deploy 上线
#   （版本 a8dd0bc2，随行 prompt 精化 + 复盘 split 代理模式）。iOS 客户端
#   Constants.swift freeDailyLimit 同日同步 2→3，三处口径一致。
#   2026-09-22 部署(版本 e5f03cee→0157fdee):D1 遥测绑定开通(见
#   docs/telemetry-d1-enablement.md)+ 新增 ZAI_ANTHROPIC_AIR provider(p3)
#   + admin 灰度切 primary→glm-4.5-air(评测三关全过,成本 -93%,PROMOTION_PLAN
#   §2.1 已闭环)。回滚 = DELETE /v1/admin/providers/primary。
#   2026-09-30 部署(版本 28a0dd3e):告警链路第三/四轮 review 修复落地
#   (送达回执 lastNotifiedLevel/重推时长取恢复时刻/明文缓存判别)。〔当时
#   漏记,2026-10-10 补登〕
#   2026-10-10 部署(版本 877b3b3f):证书链 ECDSA 签名先 DER→raw 再验
#   (d934b46)——修复真实 Apple 签发的订阅 JWS 验签必败→付费用户全被判
#   免费档;jws-fixture 改标准 DER 防回归(npm test 318/318)。生效验证:
#   带订阅真机录音一次,响应头 X-Quota-Plan 应为 pro。回滚 = wrangler rollback。
#   2026-10-11 部署(版本 fe623db5):复盘 v5 深读模式上线——mode 白名单加
#   "deep-read" + enforceDeepReadLimit(KV deepread:<date>:<device>,独立于
#   extract/assist 桶,默认 10/天/设备,超限 429 deepread_limit_exceeded;
#   DEEP_READ_DAILY_LIMIT env 可覆盖)+ 三语深读提示词(adapters)。随 iOS
#   端 v5 合入(3a3afa8)部署,现有线上版本不发 deep-read 请求,零影响;
#   新端未部署时代码 400 自动降级,本次部署即启用前置完成。生效验证:
#   新构建真机复盘走到第 3 步,深读卡渲染(需 AI 同意已授;探活
#   /v1/health=200 + 无 token deep-read 401 已过)。回滚 = wrangler rollback。
#   DAILY_REQUEST_LIMIT = "3"     PAID_DAILY_LIMIT = "100"
#
# 每设备每天调用上限（按 X-Device-ID 计；需配置 RATE_LIMIT_KV 才生效）
DAILY_REQUEST_LIMIT = "3"
# Pro 档每设备每天调用上限。订阅验签（X-Subscription-JWS）通过后按此值放行。
# ⚠️ 不配置此项 = Pro 订阅完全无效：resolveSubscriptionTier 的 hasPaidLimit 为 false
#    时直接返回 free 档，连 JWS 都不验签，付费用户和免费用户拿到完全一样的额度。
# ⚠️ 改此值必须同步 iOS 客户端 Protocols/Constants.swift 的 proDailyLimit
#    （手动双端同步，无自动机制）。生效路径不对称：本值 deploy 即时全量生效，
#    客户端常量要等 App 发版 + 用户升级。额度执行永远以本值为准，客户端常量
#    只影响 paywall 对比卡与「刚订阅、代理响应未到」矛盾窗口期的展示数字
#    （QuotaUsage.displayedLimit）；不同步 → 窗口期展示偏差，首次使用后被
#    X-Quota-Limit 权威值纠正。
PAID_DAILY_LIMIT = "100"
# ─── 订阅 JWS 验签（Pro 档判定）──────────────────────────────────────────────
# 两个值必须与 iOS 端逐字一致：bundle = project.yml 主 target 的
# PRODUCT_BUNDLE_IDENTIFIER，产品 ID = App/EntitlementManager.swift 的
# monthlyProductID / yearlyProductID。任一不匹配 → verifySubscriptionJWS 抛
# bundle_mismatch / product_mismatch → fail-safe 免费档，付费用户被静默降级
# （2026-08-20 真机复现：订阅用户第 3 次录音弹免费限制墙的根因）。
# 缺失/留空没有代码默认值兜底 → 验签必败免费档 + logError config_missing，
# 且 /v1/health 报 subscription unconfigured（503，拨测立即告警）。
# wrangler-config.test.js 会拿 iOS 源码交叉校验这两个值。
APP_BUNDLE_ID = "com.qingqingyu.voicetodo"
PRO_PRODUCT_IDS = "com.qingqingyu.voicetodo.pro.monthly,com.qingqingyu.voicetodo.pro.yearly"
# 订阅验签的计费宽限裕量（天，默认 0 = 关闭）。⚠️ 与 ASC 后台订阅组的
# Billing Grace Period 设置联动：ASC 开启宽限期后，宽限期内客户端
# currentEntitlements 仍返回过期交易（App 显示 Pro），代理严格按 expiresAt
# 拒绝会出现「显示 Pro、AI 只有免费 3 次/天」的两端不一致——届时把本值
# 设成与 ASC 相同的天数即可对齐。JWS 不含 renewalInfo，代理无法区分
# 「宽限期」与「已过期」，只能按时间裕量放行；ASC 宽限期保持关闭时
# 本值必须为 0（>0 会给所有过期订阅额外放行窗口，放大退款/过期滥用面）。
SUBSCRIPTION_GRACE_DAYS = "0"
# 全局每天调用上限：当天全网**免费档**调用超过即熔断 503（只影响免费档，见下条），
# 把分布式刷量的账单锁成可设上限。
# 估算：5000 次 × (输入 ~1-2k tok + 输出 500 tok) × z.ai 单价 ≈ 日账单天花板
GLOBAL_DAILY_LIMIT = "5000"
# 付费档全局预算（独立桶，P0：付费用户不计入、也不被免费桶熔断误伤）。
# 付费调用是有收入覆盖的成本，与防刷要挡的白嫖成本性质不同，单独立上限。
# 估算口径：预期 Pro 用户数 × 100/天 × 2~3 倍余量。⚠️ 不配置 = 付费侧无全局上限
# （device 侧 PAID_DAILY_LIMIT=100/天 仍是单设备硬顶）；trip 后错误码为
# global_budget_exceeded_pro（与免费档 global_budget_exceeded 区分）。
GLOBAL_PRO_DAILY_LIMIT = "20000"
# 全局预算滚动窗口长（小时，1..24，默认 6）。两个 GLOBAL_*_DAILY_LIMIT 在 DO 主路径
# 上都按「UTC 小时桶滚动窗口」计量：窗口内阈值 = 日限 × 窗口长/24（如 5000×6/24=1250）。
#   - 持续刷量时日成本天花板不变（维持打满的速率 = 日限/24 每小时）；
#   - 单次打穿的锁死上限 ≤ 窗口长（老桶逐小时滚出，trip 标志 TTL 只到下一个整点），
#     替代旧「锁死到 UTC 0 点」（国内用户晚间打穿要等次日早 8 点，
#     docs/pre-launch-risk-review.md 修法第 2 条）。
# 仅 DO 路径生效；KV degraded 路径仍按 UTC 日桶（见 worker.js enforceGlobalBudgetViaKV）。
GLOBAL_BUDGET_WINDOW_HOURS = "6"
# 每订阅每天 extract 调用上限（默认 500，按 UTC 日）。以验签 payload 的订阅标识
# （originalTransactionId，服务端加盐哈希后落键——隐私政策承诺只持有哈希标识）
# 为键——JWS 不绑定设备、X-Device-ID 客户端自填，「一个合法 JWS + 轮换设备 ID」
# 绕过一切按 device 计的配额；只有订阅标识是轮换不掉的身份。500 ≈ 5 台设备同时
# 打满 PAID_DAILY_LIMIT(100/天/台)，正常单人 1-3 台设备远够。超限 429
# subscription_quota_exceeded（客户端按「稍后重试」处理，重试窗口到下个 UTC 0 点）。
# UTC 日计数、不退款（成本侧反滥用闸，同全局预算口径，上游失败不回补）。
SUBSCRIPTION_DAILY_LIMIT = "500"
# 每订阅每天 assist（split/reflect，「换一批」）调用上限，与 extract 分桶互不挤占:
# assist 不占 device 计费额度、Pro 又豁免 IP 闸门，这个桶是它在订阅侧唯一的限流。
# 共用一桶时反复点「换一批」会把同一订阅所有设备的 extract 一起锁到 UTC 0 点
# （第三轮 review 新发现 2）。默认与 extract 同级 500。
SUBSCRIPTION_ASSIST_DAILY_LIMIT = "500"
# 按 IP 限流（独立于设备，挡"单 IP 轮换 X-Device-ID"）。
# ⚠️ 仅对免费档生效：验签通过的 Pro 请求豁免两道 IP 闸门（P0）——CGNAT/VPN 共享
# 出口下多名付费用户会互相误伤，且 device 侧 100/天额度对付费设备已是速度上限。
IP_DAILY_LIMIT = "500"
IP_RATE_PER_MINUTE = "10"
# 每设备每天遥测事件上限（默认 500）
TELEMETRY_DAILY_LIMIT = "500"
# 标识哈希 salt(deviceId / 订阅标识共用,见 worker.js safeDeviceId)。对订阅
# 标识是承重配置:盐若回落 APP_TOKEN(随 iOS 包分发,解包即得),~10^12 空间
# 的 originalTransactionId 可被暴力反推,「只持有哈希标识」的隐私承诺失效
# (第四轮 review 残留 2)。生产环境已通过
# `wrangler secret put LOG_HASH_SALT`(值用 openssl rand -hex 32)配置,
# secret 不落本文件,此行保持注释。
# LOG_HASH_SALT = "please-generate-a-unique-salt"

# ─── Provider 路由（z.ai Anthropic 兼容端点 + OpenAI 兼容中转） ────────────────
# 密钥不写在此处，通过 `wrangler secret put <secretName>` 注入。
#
# ⚠️ 2026-10-20 Sonnet 条目换独立 key（PROVIDER_KEY_ZAI_ANTHROPIC_2，已验证
#   200/TTFB 1.25s）：原先 Sonnet 与 glm-4.5-air 共用一把 key，z.ai 侧限流共享，
#   glm-air 429 后 failover 到 Sonnet = 白撞同一限流池直接耗尽 2 次尝试（10-18
#   key 轮换事故「全线 503」的实证形态）。换独立 key 后第二跳落独立配额。
#   ⚠️ 前提待确认：若 z.ai 限流为账号级且新旧 key 同属一个账号，隔离不成立
#   （需在 z.ai 控制台确认两 key 的账号归属/限流粒度）。部署前线上仍引用旧名
#   PROVIDER_KEY_ZAI_ANTHROPIC（旧 key 继续工作），零中间态。⚠️ 部署时序：先
#   `wrangler secret put PROVIDER_KEY_ZAI_ANTHROPIC_2`（secret put 会连带上传本地
#   配置，secret+新 toml 原子生效）；若先 deploy 新 toml 再补 secret，间隙内
#   Sonnet apiKey 空 → selector 过滤，候选只剩 AIR 一跳（failover 深度 2→1）。
#
# ⚠️ 2026-10-19 CLAWTO/GETTOKEN 改版（均 enabled:false，评测结论见下）：
#   - 旧 CLAWTO(gpt-5.4-mini, api.clawto.link) 自 10-18 key 轮换事故起 404，
#     cron 探活每 30min 记一次失败 → 永久熔断循环（「尸体在轮换里」，/v1/health
#     曾长期报 degraded）。本次换 key + 换模型 gpt-5.6-sol。
#   - 实测（2026-10-19，共 12 次请求）：两中转均活、SSE 格式与 openaiAdapter 兼容，
#     但 clawto 6 测 5 成、流式/非流式首块 10.2/12.5/39.7s（gpt-5.6-sol 为推理型，
#     思考先于首块；中转还注入 ~4.4k token 包装，成本需按服务商 console 校准）；
#     gettoken 6 测 2 成，失败形态含 30.4s 后才吐 upstream_error。直接开 = 部分请求被
#     timeoutMs=30s 掐死 → timeout 计熔断 → 重演尸体循环。
#   - 评测结论（2026-10-20，results/gpt-5.6-sol-2026-10-20T01-35-31）：**不开闸，
#     两条目长期保持 enabled:false，扩容走 z.ai 提额**。全对率 94.3%（线 ≥98%）/
#     en+zh 口径 95.1%（39/41，差 2.9pp，en 双败 = en-009 + en-027
#     due_date_basis 误标 user_explicit）/ vs 现役 air -2.9pp（air 为 09-22 旧
#     prompt 留档，严格按 §7 口径不可比；仅日期组 67/67 过）；
#     infra_error 22/75=29%（13 次 clawto 上游「illegal short-input distillation」
#     内容过滤 400→non-retryable 502 直 throw，短句重灾区）；延迟 mean 18.4s /
#     p95 39.9s 超本条目 timeoutMs=30s 预算；en-009 reminder_times 12 小时制换算错
#     （下午3点→03:00，凌晨响铃级）。gettoken 未测（同模型同过滤体系概率高，且
#     自身 6 测 2 成）。admin 接口改不了 enabled —— 若未来重新评估要翻 true，
#     必须改本文件 redeploy。
#   - secretName 换新名（V2/GETTOKEN）：部署前老线上配置仍引用旧名
#     PROVIDER_KEY_CLAWTO_OPENAI（旧 key，条目已死），新 secret 设了也不生效，
#     零中间态风险。
PROVIDERS = '''
[
  {
    "id": "ZAI_ANTHROPIC",
    "type": "anthropic",
    "url": "https://api.z.ai/api/anthropic/v1/messages",
    "model": "claude-sonnet-4-5-20250929",
    "priority": 1,
    "weight": 10,
    "enabled": true,
    "secretName": "PROVIDER_KEY_ZAI_ANTHROPIC_2",
    "timeoutMs": 30000
  },
  {
    "id": "CLAWTO_OPENAI",
    "type": "openai",
    "url": "https://api.clawto.link/v1/chat/completions",
    "model": "gpt-5.6-sol",
    "priority": 2,
    "weight": 10,
    "enabled": false,
    "secretName": "PROVIDER_KEY_CLAWTO_V2",
    "timeoutMs": 30000
  },
  {
    "id": "GETTOKEN_OPENAI",
    "type": "openai",
    "url": "https://api.gettoken.dev/v1/chat/completions",
    "model": "gpt-5.6-sol",
    "priority": 4,
    "weight": 10,
    "enabled": false,
    "secretName": "PROVIDER_KEY_GETTOKEN",
    "timeoutMs": 30000
  },
  {
    "id": "ZAI_ANTHROPIC_AIR",
    "type": "anthropic",
    "url": "https://api.z.ai/api/anthropic/v1/messages",
    "model": "glm-4.5-air",
    "priority": 3,
    "weight": 10,
    "enabled": true,
    "secretName": "PROVIDER_KEY_ZAI_ANTHROPIC",
    "timeoutMs": 30000
  }
]
'''

# App 鉴权 token：iOS 客户端通过 X-App-Token 携带，worker 校验。
# 生成一段随机串后用 `wrangler secret put APP_TOKEN` 注入。
# APP_TOKEN 通过 secret 注入，不在此处明文。

# Admin 鉴权 token：用于 /v1/admin/* endpoint(动态切换 provider 主力等运维操作)。
# 跟 APP_TOKEN 分离,避免普通客户端能调 admin endpoint 改 provider 配置。
# 生成随机串后用 `wrangler secret put ADMIN_TOKEN` 注入(建议用 openssl rand -hex 32)。
# 客户端通过 X-Admin-Token header 携带,worker 在 handleAdminRequest 里校验。
# ADMIN_TOKEN 通过 secret 注入,不在此处明文。

# 每次请求最多尝试多少个 provider。
# ⚠️ 必须显式设置,不能依赖默认值(= 过滤后的候选总数)。iOS 端 NetworkConfig.apiTimeout
#    是按 (MAX_ATTEMPTS - 1) × timeoutMs + 余量 推算的;不写死这里的话,以后新增第三个
#    provider 会让 Worker 最坏耗时从 40s 涨到 70s,而客户端仍在 55s 放弃 —— 客户端会在
#    Worker 还在 failover 时就断线,并把这次放弃记成一次服务故障喂给自己的熔断器。
#    wrangler-config.test.js 有断言守着这个不变量。
AI_PROVIDER_MAX_ATTEMPTS = "2"

# 可选：熔断参数覆盖。不配置时用代码默认值(threshold=5, initialCooldown=10s, maxCooldown=5min)。
# configureHealthParams(env) 在每次 request entry 读取,改 env 后下次 deploy 即生效。
# CIRCUIT_OPEN_THRESHOLD = "5"
# CIRCUIT_INITIAL_COOLDOWN_MS = "10000"
# CIRCUIT_MAX_COOLDOWN_MS = "300000"

# ─── KV 命名空间 ────────────────────────────────────────────────────────────
# RATE_LIMIT_KV：每设备配额 + 全局预算 + IP 限流共用
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "17ea278a008b4599988f1a5882ad252a"

# AI_PROVIDER_STATE_KV：供应商健康状态（熔断器 / EWMA 延迟），跨 isolate 共享
[[kv_namespaces]]
binding = "AI_PROVIDER_STATE_KV"
id = "ef09b0ad898241d5aa33291f406beb7e"

# ─── D1 遥测存储(2026-09-22 开通,方案见 docs/telemetry-d1-enablement.md)────
# 建库:`wrangler d1 create voicetodo-telemetry`(返回的 id 填下面)
# 初始化 schema:`wrangler d1 execute voicetodo-telemetry --remote --file=./schema.sql`
# ⚠️ execute 必须带 --remote,否则只建到本地 miniflare,线上空表 → 全部 insert 失败
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "voicetodo-telemetry"
database_id = "5861ea98-ab16-49c8-9c3f-e4baab1aa297"

# Cron triggers:每 30 分钟跑一次 handleScheduled,做四件事:
#   1. telemetry GC(90 天保留,需 TELEMETRY_DB binding)
#   2. provider 主动健康检查(P3):并行 ping 所有 provider,更新 HealthStore 状态
#   3. 状态跃迁告警(层 B,ALERTING.md):全挂/恢复推 Telegram(需 TELEGRAM_* secrets)
#   4. healthchecks.io 心跳(层 C-2):死人开关(需 HEALTHCHECK_PING_URL)
# 成本估算:每 30min × N provider = N*48 次/天,2 provider ≈ 96 次/天 ≈ $1/天
[triggers]
crons = ["*/30 * * * *"]

# ─── 告警 secrets(层 B/C,全部可选,缺配只 logWarn 不会让核心链路挂掉)─────
# Telegram 推送:与 feedback-relay 用同一个 bot(贴相同的值),两个都配才生效。
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#
# healthchecks.io 死人开关:cron 每次跑完 ping 一次,心跳断了它反向告警 ——
# 唯一能覆盖「告警系统自身挂了」的手段。ping URL 含 uuid,等价于凭据,
# 按 secret 处理,不写进 wrangler.toml。
#   wrangler secret put HEALTHCHECK_PING_URL

# ─── Extraction Cache KV(解析结果缓存)─────────────────────────────────────
# 用于 P2:同一 transcript 1h TTL 缓存,省上游 AI 调用。
# 创建命令:npx wrangler kv namespace create CACHE_RESULT_KV
[[kv_namespaces]]
binding = "CACHE_RESULT_KV"
id = "f241a8c418c74c92bcd19d8fb2a7c42f"

# ─── Durable Objects ─────────────────────────────────────────────────────────
# QuotaCounter: 强一致配额计数器,替代 KV 上的 read-modify-write(后者在并发下丢失更新)。
# Step 2 阶段:binding 已声明,worker.js 入口已 export,但业务路径仍走 KV。
# Step 3 起按"每设备 → IP-daily → 全局预算"顺序逐步切换读路径到 DO。
# 部署注意:首次 wrangler deploy 时 [[migrations]] 会创建 DO 类,需要在 Workers Paid 计划。
[[durable_objects.bindings]]
name = "QUOTA_COUNTER_DO"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1-quota-counter"
new_sqlite_classes = ["QuotaCounter"]
